<!doctype html><html><head><meta charset="utf-8"><title>s09b loop farm</title>
<script type="importmap">{"imports":{"three":"../lib/three.module.js","three/addons/":"../lib/jsm/"}}</script></head>
<body><script type="module">
// 09b | 70.1–73.5 s | LOOP CLOSES (farm, weeks later) — compost windrows at different ages (fresh → mature), steam on a cool
// morning; then finished compost worked in around a young tomato seedling. No instant transformation: time has passed.
import * as K from '../lib/core.js';
import * as P from '../lib/props.js';
import * as F from '../lib/foliage.js';
import { farm } from '../lib/sets.js';
import { puppet, extraSpec } from '../lib/people.js';
const { THREE, V } = K;
await K.loadNormals(['clay', 'skin', 'cloth', 'knit', 'rock', 'plaster', 'woodgrain', 'soil']);
const app = new K.App({ duration: 3.4, fov: 32, exposure: 1.0, dof: { aperture: 0.004, maxblur: 0.012 }, bloomStrength: 0.25, bloomThreshold: 0.8, warmth: 0.99, sat: 1.0, vignette: 0.34 });
await app.hdri('park', { intensity: 0.5, rotation: 2.2 });
const sunDir = V(0.45, 0.6, 0.7);
await farm(app, { sunDir, top: '#6e94c4', mid: '#c4d0d8', horizon: '#f0dcc0', sunColor: '#ffe0b8', fog: '#e6e2da', cloudColor: '#ffffff', glow: 0.5, sunDisc: 2, sunI: 3.0, hemi: 0.6, hemiSky: '#cfdcea', near: V(0, 0, 2), focus: V(-8, 0, -6), shadowSize: 16, mastPos: [9.5, -24],
  clear: (x, z) => Math.abs(x) < 0.2 && z > -0.5 });
// compost yard beyond the west hedgerow: three windrows, fresh (green-brown) → mature (dark, crumbly)
const S = app.scene; K.seed(93);
const rows = [[-20.5, '#4e3826', '#a08a58', 0.45], [-24.0, '#3a2a1c', '#7a6a48', 0.2], [-27.5, '#261a12', '#261a12', 0.0]];
for (const [x, base, tint, straw] of rows) { const g = P.windrowGeo(12, 2.6, 1.35, x); const cols = new Float32Array(g.attributes.position.count * 3); const c1 = new THREE.Color(base).lerp(new THREE.Color('#ffffff'), 0.35), c2 = new THREE.Color(tint).lerp(new THREE.Color('#ffffff'), 0.35);
  for (let i = 0; i < cols.length / 3; i++) { const n = K.noise2(g.attributes.position.getX(i) * 0.9, g.attributes.position.getZ(i) * 0.9); const c = c1.clone().lerp(c2, n * straw * 0.8); cols[i * 3] = c.r; cols[i * 3 + 1] = c.g; cols[i * 3 + 2] = c.b; }   // (only broad variation per vertex: detail lives in the texture)
  g.setAttribute('color', new THREE.BufferAttribute(cols, 3));
  const map = P.compostTex(straw * 1.6, Math.round(-x)).clone(); map.needsUpdate = true; map.repeat.set(12 / 0.6, 4.16 / 0.6);
  const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ vertexColors: true, map, roughness: 0.98, normalMap: K.normalTex('soil', 8), normalScale: new THREE.Vector2(1.2, 1.2) })); m.rotation.y = Math.PI / 2; m.position.set(x, 0, -11); m.castShadow = true; m.receiveShadow = true; S.add(m);
  for (let k = 0; k < 4; k++) K.steam(app, { at: V(x + K.R(-0.3, 0.3), 1.2, -11 + K.R(-5, 5)), count: 7, height: 1.6, size: 1.1, opacity: 0.2, spread: 0.5, life: 4 }); }
const yard = K.mesh(new THREE.PlaneGeometry(14, 18), K.mat('#7a6a50', { roughness: 1, map: K.grain('soil', { repeat: 8 }) }), { cast: false }); yard.rotation.x = -Math.PI / 2; yard.position.set(-24, 0.015, -11); S.add(yard);
const wb = P.wheelbarrow({ fill: '#2e2016' }); wb.position.set(-22.3, 0, -3.6); wb.rotation.y = 0.6; S.add(wb);
const turner = puppet('T1', extraSpec(95, { outer: 'none', top: '#7a8c5e', hairStyle: 'cap', capColor: '#3a4b5c' })); turner.place(-22.25, -8.5, -Math.PI / 2 + 0.3); app.cast(turner);
const fork = P.tool('fork'); S.add(fork);
turner.act([{ t: 0, pose: 'stand', mod: (t) => ({ spX: 0.35 + Math.sin(t * 2.4) * 0.15, drop: 0.05 }), talk: 0 }]);
turner.hand('R', [{ t: 0, at: (t) => turner.root.localToWorld(V(0.12, 0.95 + Math.sin(t * 2.4) * 0.12, 0.38)), pole: [0.7, -0.6, -0.3] }]);
turner.hand('L', [{ t: 0, at: (t) => turner.root.localToWorld(V(-0.05, 0.7 + Math.sin(t * 2.4) * 0.1, 0.55)), pole: [-0.7, -0.6, -0.3] }]);
turner.look([{ t: 0, at: V(-20.6, 0.9, -8.6) }]);
app.after(t => { const a = turner.arms.R.grip.getWorldPosition(V()), b = turner.arms.L.grip.getWorldPosition(V()); fork.position.copy(b); fork.lookAt(a); fork.rotateX(Math.PI / 2); fork.position.copy(b).add(b.clone().sub(a).normalize().multiplyScalar(-0.2)); });

// seedling bed (start of a tomato row): finished compost, hands working it around a young plant
// young tomato seedlings (no stakes yet): short stems, a few true leaves
const seedParts = []; const sh = 0.13;
{ const pts = [V(0, 0, 0), V(0.004, sh * 0.35, 0.002), V(-0.002, sh * 0.7, 0.004), V(0.002, sh, 0)], stem = new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 24, 0.0017, 8, false), sp = stem.attributes.position, sc = new Float32Array(sp.count * 3);
  for (let i = 0; i < sp.count; i++) { const v = sp.getY(i) / sh, r = 1 - 0.35 * v; sp.setX(i, sp.getX(i) * r); sp.setZ(i, sp.getZ(i) * r); const c = new THREE.Color('#4a3040').lerp(new THREE.Color('#3d6626'), K.smooth(K.clamp(v * 3))); sc.set([c.r, c.g, c.b], i * 3); }   // tapering, purple at the base
  stem.setAttribute('color', new THREE.BufferAttribute(sc, 3)); seedParts.push({ geo: stem, m: new THREE.Matrix4(), color: null }); }
for (let i = 0; i < 5; i++) { const a = i * 2.39996, y = 0.05 + i * 0.018, sz = 0.07 + (4 - i) * 0.008; const card = new THREE.PlaneGeometry(sz * 0.8, sz, 2, 3); card.translate(0, sz / 2, 0); const pp = card.attributes.position; for (let k = 0; k < pp.count; k++) { const yy = pp.getY(k) / sz; pp.setZ(k, 0.35 * sz * yy * yy); } card.computeVertexNormals(); seedParts.push({ geo: card, m: K.M4(Math.cos(a) * 0.005, y, Math.sin(a) * 0.005, -0.9, -a + Math.PI / 2, 0), color: '#ffffff' }); }
const seedGeo = K.merged(seedParts.slice(1)); const stemGeo = seedParts[0].geo;
const seeds = []; for (let z = 3.6; z > -0.4; z -= 0.45) seeds.push({ x: K.R(-0.03, 0.03), y: 0.12, z, ry: K.R(0, 6), s: K.R(0.9, 1.15) });
const CL = F.compoundLeaf(); K.instanced(S, seedGeo, new THREE.MeshStandardMaterial({ map: CL.map, normalMap: CL.normalMap, alphaTest: 0.5, side: THREE.DoubleSide, roughness: 0.6, vertexColors: true }), seeds); const stemMat = new THREE.MeshPhysicalMaterial({ vertexColors: true, roughness: 0.65, sheen: 0.22, sheenRoughness: 0.5, sheenColor: new THREE.Color('#b8d090') });   // (downy)
K.instanced(S, stemGeo, stemMat, seeds);
const hero = new THREE.Group(); hero.add(new THREE.Mesh(seedGeo, new THREE.MeshStandardMaterial({ map: CL.map, normalMap: CL.normalMap, alphaTest: 0.5, side: THREE.DoubleSide, roughness: 0.55, vertexColors: true }))); hero.add(new THREE.Mesh(stemGeo, stemMat)); hero.position.set(0, 0.125, 2.5); hero.scale.setScalar(1.25); hero.traverse(m => { if (m.isMesh) m.castShadow = true; }); S.add(hero);
const macroFill = new THREE.PointLight('#fff1dc', 0.8, 1.5, 2); macroFill.position.set(0.25, 0.45, 2.85); S.add(macroFill);
// finished compost worked in round it: a crumbly patch, raised a little, with lumpy crumbs on it (smooth, not faceted)
const patchG = new THREE.CircleGeometry(0.22, 64, 0, Math.PI * 2); { const pp = patchG.attributes.position; for (let i = 0; i < pp.count; i++) { const x = pp.getX(i), y = pp.getY(i), r = Math.hypot(x, y) / 0.22; pp.setZ(i, (1 - r * r) * 0.012 + (K.noise2(x * 60, y * 60) - 0.5) * 0.006 * (1 - r)); } patchG.computeVertexNormals(); }
const patchMap = P.compostTex(0.05, 41).clone(); patchMap.needsUpdate = true; patchMap.repeat.set(0.75, 0.75);
const ring = new THREE.Mesh(patchG, new THREE.MeshStandardMaterial({ color: '#c9bfb4', map: patchMap, roughness: 1, normalMap: K.normalTex('soil', 2), normalScale: new THREE.Vector2(1.4, 1.4) })); ring.rotation.x = -Math.PI / 2; ring.position.set(0, 0.125, 2.5); ring.receiveShadow = true; S.add(ring);
const crumbGs = [0, 1, 2, 3].map(k => P.crumbGeo(0.0055, k * 5.1)), crumbMs = ['#22170f', '#2c1f15', '#1a120c', '#35271b'].map(c => K.mat(c, { roughness: 1, normalMap: K.normalTex('soil', 6), normalScale: new THREE.Vector2(1.6, 1.6) }));
const heap = []; for (let i = 0; i < 220; i++) { const m = new THREE.Mesh(crumbGs[i % 4], crumbMs[(i * 7) % 4]); const a = K.R(0, 6.28), d = K.R(0.025, 0.21), sz = K.R(0.4, 1.25); m.scale.setScalar(sz); m.rotation.set(K.R(0, 3), K.R(0, 6), K.R(0, 3)); m.position.set(Math.cos(a) * d, 0.13 + (1 - d / 0.22) * 0.01 + 0.004 * sz, 2.5 + Math.sin(a) * d); m.castShadow = true; m.receiveShadow = true; S.add(m); heap.push(m); }
const asha = puppet('ASHA'); asha.place(-0.5, 2.3, 1.2); app.cast(asha);
asha.act([{ t: 0, pose: 'kneel', talk: 0 }]);
const grains = []; for (let i = 0; i < 18; i++) { const m = new THREE.Mesh(crumbGs[i % 4], crumbMs[0]); m.scale.setScalar(K.R(0.7, 1.4)); S.add(m); grains.push([m, K.R(0, 1), K.R(-0.05, 0.05), K.R(-0.05, 0.05)]); }
const toSeed = (p) => V(0, 0.15, 2.5).sub(p).setY(-0.35).normalize();
asha.hand('R', [{ t: 0, at: (t) => V(-0.12 + Math.sin(t * 3) * 0.02, 0.165 + Math.max(0, Math.sin(t * 3)) * 0.03, 2.36), pole: [0.6, -0.4, -0.6], shape: 'relaxed', aim: () => ({ fingers: toSeed(V(-0.12, 0.17, 2.36)), palm: V(0, -1, 0) }) }]);
asha.hand('L', [{ t: 0, at: (t) => V(-0.15, 0.158 + Math.max(0, Math.sin(t * 3 + 1.5)) * 0.025, 2.63), pole: [-0.6, -0.4, -0.6], shape: 'relaxed', aim: () => ({ fingers: toSeed(V(-0.15, 0.16, 2.63)), palm: V(0, -1, 0) }) }]);
asha.look([{ t: 0, at: V(0, 0.18, 2.5) }]);
asha.face([{ t: 0, smile: 0.45, brow: 0.1 }]);
app.on(t => { for (const [m, ph, dx, dz] of grains) { const u = ((t * 0.9 + ph) % 1); const g = asha.arms.R.grip; m.visible = t > 1.6; if (!m.visible) continue; const p = g.getWorldPosition(V()); m.position.set(p.x + dx, p.y - u * 0.08, p.z + dz); } });

// camera: C wide on the windrows (steam, the turner) → D low macro: compost around the seedling
app.rig = new K.Rig([
  { t: 0.0, pos: [-18.3, 2.5, 1.8], look: [-24.6, 0.6, -11.0], fov: 34, focus: [-22, 1, -8.5], aperture: 0.0015 },
  { t: 1.65, pos: [-18.6, 2.45, 1.0], look: [-24.6, 0.6, -11.5], fov: 33, focus: [-22, 1, -8.5], aperture: 0.0015 },
  { t: 1.6501, cut: true, pos: [0.36, 0.3, 2.9], look: [-0.02, 0.2, 2.48], fov: 30, focus: [0.0, 0.2, 2.5], aperture: 0.02 },
  { t: 3.4, pos: [0.3, 0.27, 2.84], look: [-0.02, 0.2, 2.48], fov: 27, focus: [0.0, 0.2, 2.5], aperture: 0.02 },
], { handheld: 0.5 });
app.ready();
</script></body></html>
