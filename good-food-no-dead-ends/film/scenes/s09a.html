<!doctype html><html><head><meta charset="utf-8"><title>s09a loop kitchen</title>
<script type="importmap">{"imports":{"three":"../lib/three.module.js","three/addons/":"../lib/jsm/"}}</script></head>
<body><script type="module">
// 09a | 65.5–70.1 s | LOOP CLOSES (kitchen) — two separate streams after dinner:
// clean, lidded tubs of safe UNSERVED food for a food-rescue partner, and inedible peels/scraps into the organics caddy.
// NOOR: "And the scraps?"  ASHA: "Back to the soil."
import * as K from '../lib/core.js';
import * as P from '../lib/props.js';
import * as F from '../lib/foliage.js';
import { kitchen } from '../lib/sets.js';
import { puppet } from '../lib/people.js';
const { THREE, V } = K;
await K.loadNormals(['clay', 'skin', 'cloth', 'knit', 'rock', 'plaster', 'woodgrain', 'planks', 'tiles', 'soil']);
K.seed(91);
const app = new K.App({ duration: 4.6, fov: 30, exposure: 1.05, dof: { aperture: 0.005, maxblur: 0.012 }, bloomStrength: 0.28, bloomThreshold: 0.8, warmth: 1.05, sat: 1.03, vignette: 0.34 });
await app.hdri('apartment', { intensity: 0.4, rotation: 1.2 });
const K1 = await kitchen(app, { time: 'evening' });
const S = app.scene;
// stainless prep island (people work facing the room)
const island = new THREE.Group(); S.add(island); island.position.set(2.4, 0, -1.45);
island.add(K.at(K.box(0.72, 0.05, 2.0, K.MAT.brushed(), { r: 0.01 }), 0, 0.9, 0)); island.add(K.at(K.box(0.66, 0.84, 1.9, K.mat('#6f5a44', { roughness: 0.7, map: K.grain('wood', { repeat: 2 }) })), 0, 0.43, 0));
K.bake(island);
const top = 0.925;
// stream 1 — safe unserved food: clean lidded tubs, an insulated carrier bag for the rescue partner
const tubs = []; for (let i = 0; i < 5; i++) { const tb = P.rescueContainer({ food: i % 2 ? '#c9852a' : '#b8401f', lid: '#2f8a57' }); tb.position.set(2.5 + (i % 2) * 0.27 - 0.13, top + 0.045 + Math.floor(i / 2) * 0.105, -2.2 + (i % 2) * 0.02); if (i === 4) tb.position.set(2.6, top + 0.045, -1.85); S.add(tb); tubs.push(tb); }
const bag = new THREE.Group(); bag.add(K.box(0.42, 0.32, 0.3, K.mat('#2f5a8a', { roughness: 0.8, normalMap: K.normalTex('cloth', 2), normalScale: new THREE.Vector2(0.6, 0.6) }), { r: 0.04 })); bag.add(K.at(K.box(0.3, 0.02, 0.03, K.mat('#222')), 0, 0.2, 0)); bag.position.set(2.45, top + 0.16, -2.75); bag.rotation.y = 0.2; S.add(bag);
// stream 2 — inedible scraps: board of tomato cores, onion skins, carrot tops → organics caddy
const BX = 2.6;   // the board and caddy sit at the counter's edge, within a child's reach
const board = P.ware.board(0.4, 0.28); board.position.set(BX, top, -1.12); board.rotation.y = Math.PI / 2; S.add(board);
const scraps = new THREE.Group(); S.add(scraps);
const sg = [P.produceGeo('onion', { color: '#c98a4a' }), P.tomatoGeo({ r: 0.022, ugly: true, seg: 10, color: '#a83a22', seed: 5 }), P.produceGeo('carrot')];
const KINDS = ['onion', 'tomato', 'carrot', 'peel', 'onion', 'potato'];
// two lanes the scraper will clear (one per stroke, side by side) and, behind where the strokes start, the scraps left for later
const LANES = [-0.045, 0.06];
for (let i = 0; i < 16; i++) { const m = F.scrap(KINDS[i % KINDS.length], 300 + i), k = Math.floor(i / 5);
  if (k < 2) m.position.set(LANES[k] + K.R(-0.04, 0.04), 0.012, K.R(-0.08, 0.05)); else m.position.set(K.R(-0.1, 0.1), 0.012, K.R(-0.19, -0.14));
  m.rotation.set(K.R(-0.4, 0.4), K.R(0, 6), K.R(-0.4, 0.4)); scraps.add(m); }
const caddy = P.caddy({ color: '#3f5a38', lid: '#4c6e3e' }); caddy.position.set(BX - 0.04, top, -0.66); caddy.rotation.y = -Math.PI / 2; S.add(caddy);
const falling = []; for (let i = 0; i < 5; i++) { const m = F.scrap(KINDS[i % KINDS.length], 400 + i); S.add(m); falling.push([m, 3.55 + i * 0.09, K.R(-0.05, 0.05), K.R(-0.04, 0.04), K.R(0, 6)]); }
app.on(t => { const c = caddy.getWorldPosition(V()); for (const [m, t0, dx, dz, r] of falling) { const u = K.clamp((t - t0) / 0.35); m.visible = t > t0 - 0.05; m.position.set(c.x + dx, c.y + 0.36 - 0.21 * u * u, c.z + 0.06 - 0.06 * u + dz); m.rotation.set(r + u * 2, r, u * 3); } });
// a bench scraper: a steel blade 12 x 7.2 cm with a wooden grip along its top edge
const spat = new THREE.Group(); spat.add(K.at(K.box(0.12, 0.072, 0.0016, K.MAT.steel()), 0, 0.036, 0));
{ const grip = K.cyl(0.0115, 0.0115, 0.124, K.mat('#5a3d28', { roughness: 0.55 }), 16); grip.rotation.z = Math.PI / 2; grip.position.y = 0.08; spat.add(grip); } S.add(spat);
// cast
const lines = await K.dialogue('s09');
const noor = puppet('NOOR'); noor.place(2.88, -1.02, -Math.PI / 2); app.cast(noor); noor.speak(lines);
const asha = puppet('ASHA'); asha.place(3.12, -0.28, -Math.PI / 2 - 0.35); app.cast(asha); asha.speak(lines);
const cook = puppet('COOK'); cook.place(2.94, -2.0, -Math.PI / 2 + 0.25); app.cast(cook); cook.speak(lines);
// Noor scrapes the board into the caddy (lid open), asks; Asha closes the lid on "soil"
const lidHinge = caddy.userData.lid;
noor.act([{ t: 0, pose: 'stand', talk: 0.3 }]);
const scrapeT = (t) => { const u = (t % 1.2) / 1.2; return u; };
// the scraper is held like a knife, blade down on the board, and drawn along it in strokes towards the caddy end, then
// lifted and carried back through the air (one continuous motion: no jump back to the start); the other hand steadies the board
const nd = (x, y, z) => noor.dirToWorld([x, y, z]);
// the scraper leads (upright, edge on the board, leaning back a little, pushed edge-first towards the caddy end) and the
// hand holds its grip from above, fingers along it; after the last stroke it stays in her hand as she lowers it
const STROKE = 0.62, T_END = 1.2 + STROKE * 1.2, BOARD_TOP = top + 0.011, zA = -1.235, zB = -1.045;
const scrPose = (t) => { const u = scrapeT(Math.min(t, T_END - 1e-4));
  if (u < STROKE) return { z: K.lerp(zA, zB, K.smooth(u / STROKE)), lift: 0 };
  const s = K.smooth((u - STROKE) / (1 - STROKE)); return { z: K.lerp(zB, zA, s), lift: 0.06 * Math.sin(Math.PI * s) }; };
let spatHeld = null, gripEnd = null;   // the scraper in the hand's frame, and where the hand is, at the end of the last stroke
const handM = () => { const f = noor.handFrame('R'); return new THREE.Matrix4().compose(f.pos, f.quat, V(1, 1, 1)); };
app.on(t => { if (spatHeld && t >= T_END) { handM().multiply(spatHeld).decompose(spat.position, spat.quaternion, V()); return; }
  const p = scrPose(t), n = Math.min(1, Math.floor(Math.min(t, T_END - 1e-4) / 1.2)), u = scrapeT(Math.min(t, T_END - 1e-4));
  const laneX = u < STROKE ? LANES[n] : K.lerp(LANES[n], LANES[1 - n] ?? LANES[n], K.smooth((u - STROKE) / (1 - STROKE)) * (n === 0 ? 1 : 0));   // (moves over to the next lane on the way back)
  spat.position.set(BX + laneX, BOARD_TOP + 0.0008 + p.lift, p.z); spat.rotation.set(-0.22, 0, 0); });
app.after(t => { if (spatHeld && t >= T_END) { handM().multiply(spatHeld).decompose(spat.position, spat.quaternion, V()); spat.updateMatrixWorld(true); } });
const gripAt = () => spat.localToWorld(V(0.012, 0.08, 0.0));
noor.hand('R', [{ t: 0, at: (t) => t >= T_END ? null : gripAt(), pole: [0.6, -0.7, -0.3], shape: 'hold', aim: () => ({ fingers: V(-1, -0.35, 0.1).normalize(), palm: V(0.1, -1, 0.55).normalize() }) },
  { t: T_END, at: () => gripEnd, blend: 0.0001, pole: [0.6, -0.7, -0.3], shape: 'hold', aim: () => ({ fingers: V(-1, -0.35, 0.1).normalize(), palm: V(0.1, -1, 0.55).normalize() }) },
  { t: 2.2, at: () => noor.root.localToWorld(V(0.15, 0.8, 0.22)), blend: 0.5, shape: 'hold', aim: () => ({ fingers: nd(-0.2, -0.5, 1), palm: nd(-0.9, 0.1, 0) }) }]);
noor.hand('L', [{ t: 0, at: () => V(BX + 0.105, BOARD_TOP + 0.012, -0.955), pole: [-0.6, -0.7, -0.3], shape: 'relaxed', aim: () => ({ fingers: nd(0.15, -0.15, 1), palm: V(0, -1, 0) }) }, { t: 2.2, at: null, blend: 0.5 }]);
noor.look([{ t: 0, at: () => caddy.getWorldPosition(V()).add(V(0, 0.15, 0)) }, { t: 1.0, at: () => asha.head.getWorldPosition(V()), blend: 0.4 }, { t: 3.6, at: () => caddy.getWorldPosition(V()).add(V(0, 0.15, 0)), blend: 0.4 }]);
noor.face([{ t: 0, smile: 0.2, brow: 0.3 }, { t: 1.1, smile: 0.25, brow: 0.6 }, { t: 3.9, smile: 0.55, brow: 0.3 }]);
asha.act([{ t: 0, pose: 'stand', talk: 0.3 }]);
asha.hand('R', [{ t: 0, at: null }, { t: 3.75, at: () => lidHinge.localToWorld(V(0, 0.03, 0.2)), blend: 0.35, pole: [0.7, -0.6, -0.3] }]);
asha.look([{ t: 0, at: () => noor.head.getWorldPosition(V()) }, { t: 2.5, at: () => caddy.getWorldPosition(V()).add(V(0, 0.2, 0)), blend: 0.35 }, { t: 4.2, at: () => noor.head.getWorldPosition(V()), blend: 0.3 }]);
asha.face([{ t: 0, smile: 0.4, brow: 0.1 }, { t: 3.2, smile: 0.5, brow: 0.3 }]);
cook.act([{ t: 0, pose: 'stand', talk: 0 }]);
// the cook snaps a lid down: one hand holds the tub, the other presses the lid's edge
const cd = (x, y, z) => cook.dirToWorld([x, y, z]);
cook.hand('R', [{ t: 0, at: (t) => tubs[4].localToWorld(V(0.06, 0.075 + Math.max(0, Math.sin(t * 5)) * 0.012, 0.02)), pole: [0.7, -0.6, -0.3], shape: 'relaxed', aim: () => ({ fingers: cd(-0.3, -0.35, 1), palm: cd(0, -1, 0) }) }]);
cook.hand('L', [{ t: 0, at: () => tubs[4].localToWorld(V(-0.03, 0.02, -0.105)), pole: [-0.7, -0.6, -0.3], shape: 'hold', aim: () => ({ fingers: cd(0.2, -0.1, 1), palm: cd(1, 0, 0) }) }]);
cook.look([{ t: 0, at: () => tubs[4].getWorldPosition(V()) }, { t: 2.6, at: () => noor.head.getWorldPosition(V()), blend: 0.5 }]);
cook.face([{ t: 0, smile: 0.35 }]);
// each stroke pushes five scraps ahead of the blade into a pile at the caddy end of the board (nothing vanishes)
const scrap0 = scraps.children.map(m => m.position.clone());
app.on(t => { lidHinge.rotation.x = -1.6 * (1 - K.smooth((t - 4.12) / 0.42)); scraps.position.set(BX, top, -1.12);
  const n = Math.floor(t / 1.2), u = scrapeT(t), blade = (n < 2 && u < STROKE) ? scrPose(t).z + 1.12 : zB + 1.12;   // (the blade, in the scraps' frame)
  // a scrap in the blade's lane moves with the blade once the blade reaches it, gathering towards the lane's middle,
  // and ends in a small pile just ahead of where the stroke stops
  const bEnd = zB + 1.12;
  scraps.children.forEach((m, i) => { const k = Math.floor(i / 5), j = i % 5, p0 = scrap0[i]; if (k > 1) return;
    const ahead = 0.016 + (j % 3) * 0.009, bz = n > k ? bEnd : n === k ? blade : -1;   // (where the blade is, for this scrap's lane)
    const z = Math.max(p0.z, bz + ahead), f = K.clamp((z - p0.z) / Math.max(0.01, bEnd + ahead - p0.z));
    m.position.set(K.lerp(p0.x, LANES[k] + (j - 2) * 0.017, K.smooth(f)), p0.y + 0.006 * (j % 2) * f, z); }); });

// camera: A across the island (both streams in one frame) → B Asha (closes the lid on "soil"), scraps falling into the caddy (match cut)
const nF = () => noor.head.getWorldPosition(V()).add(V(0, 0.09, 0)), aF = () => asha.head.getWorldPosition(V()).add(V(0, 0.09, 0));
app.evaluate(T_END - 1e-3); gripEnd = gripAt(); spatHeld = handM().invert().multiply(spat.matrixWorld.clone());   // the scraper stays in her hand from here
app.rig = new K.Rig([
  { t: 0.0, pos: [0.95, 1.38, -1.15], look: [2.7, 1.08, -1.25], fov: 40, focus: nF, aperture: 0.003 },
  { t: 2.45, pos: [1.15, 1.36, -1.05], look: [2.7, 1.08, -1.2], fov: 37, focus: nF, aperture: 0.003 },
  { t: 2.4501, cut: true, pos: () => aF().add(V(-1.45, -0.05, 0.45)), look: () => aF().add(V(0.0, -0.14, 0)), fov: 24, focus: aF, aperture: 0.005 },
  { t: 3.55, pos: () => aF().add(V(-1.38, -0.05, 0.42)), look: () => aF().add(V(0.0, -0.15, 0)), fov: 23, focus: aF, aperture: 0.005 },
  { t: 3.5501, cut: true, pos: () => caddy.getWorldPosition(V()).add(V(-0.12, 0.7, 0.02)), look: () => caddy.getWorldPosition(V()).add(V(0, 0.16, 0)), fov: 34, focus: () => caddy.getWorldPosition(V()).add(V(0, 0.14, 0)), aperture: 0.01 },
  { t: 4.6, pos: () => caddy.getWorldPosition(V()).add(V(-0.06, 0.55, 0.02)), look: () => caddy.getWorldPosition(V()).add(V(0, 0.16, 0)), fov: 30, focus: () => caddy.getWorldPosition(V()).add(V(0, 0.14, 0)), aperture: 0.01 },
], { handheld: 0.5 });
app.ready();
</script></body></html>
