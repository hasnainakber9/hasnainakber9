const facadeCache = {};
function facadeTex(wall, shut) {
  const key = wall + shut; if (facadeCache[key]) return facadeCache[key];
  const S = 512, cv = [0, 1, 2].map(() => { const c = document.createElement('canvas'); c.width = c.height = S; return c; }); const [g, hg, rg] = cv.map(c => c.getContext('2d'));
  const X = (u) => u * S, Y = (v) => v * S; const box = (ctx, x0, y0, x1, y1, col) => { ctx.fillStyle = col; ctx.fillRect(X(x0), Y(y0), X(x1 - x0), Y(y1 - y0)); };

  box(g, wx0 - 0.016, wy0 - 0.005, wx1 + 0.016, wy1 + 0.005, '#f4f0e6'); box(hg, wx0 - 0.016, wy0 - 0.005, wx1 + 0.016, wy1 + 0.005, '#a8a8a8'); box(rg, wx0 - 0.016, wy0 - 0.005, wx1 + 0.016, wy1 + 0.005, '#909090');   // frame
  const gl = g.createLinearGradient(0, Y(wy0), 0, Y(wy1)); gl.addColorStop(0, '#a9bccd'); gl.addColorStop(0.45, '#6f8296'); gl.addColorStop(1, '#2f3a46');

  g.fillStyle = 'rgba(255,255,255,0.18)'; g.beginPath(); g.moveTo(X(wx0), Y(wy0 + 0.25)); g.lineTo(X(wx0 + 0.18), Y(wy0)); g.lineTo(X(wx0 + 0.26), Y(wy0)); g.lineTo(X(wx0), Y(wy0 + 0.36)); g.fill();   // a streak of reflected sky

  const nc = document.createElement('canvas'); nc.width = nc.height = S; const hd = hg.getImageData(0, 0, S, S).data, nimg = new ImageData(S, S), d = nimg.data, H = (x, y) => hd[((Math.min(S - 1, Math.max(0, y))) * S + Math.min(S - 1, Math.max(0, x))) * 4] / 255;
