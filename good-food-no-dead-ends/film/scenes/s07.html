add(1, [{ t: 0, x: -0.6, z: 3.5, yaw: Math.PI }, { t: 8.5, x: -0.9, z: -5.0, yaw: Math.PI, ease: 'linear' }]);
add(2, [{ t: 0, x: 1.8, z: -0.8, yaw: -Math.PI / 2 }]).act([{ t: 0, pose: 'pick', mod: { spX: 0.25, drop: -0.25 } }]);
add(8, [{ t: 0, x: -0.2, z: -16, yaw: 0.1 }, { t: 8.5, x: 0.3, z: -9.0, yaw: 0.1, ease: 'linear' }], { build: 'f' });
add(9, [{ t: 0, x: 1.0, z: 9.5, yaw: Math.PI }, { t: 8.5, x: 1.1, z: 2.0, yaw: Math.PI, ease: 'linear' }], { elder: true, build: 'f' });
add(10, [{ t: 0, x: -1.0, z: -11, yaw: 0 }, { t: 8.5, x: -0.6, z: -4.2, yaw: 0, ease: 'linear' }], { build: 'm' });
add(11, [{ t: 0, x: 2.0, z: -12.5, yaw: -Math.PI / 2 + 0.4 }], { build: 'f', hairStyle: 'curly' }).act([{ t: 0, pose: 'holdFront', p: { h: 1.0 } }]);
add(12, [{ t: 0, x: -1.8, z: 5.0, yaw: Math.PI / 2 - 0.3 }], { child: true }).act([{ t: 0, pose: 'stand' }]);
add(3, [{ t: 0, x: 0.2, z: 6.0, yaw: Math.PI }, { t: 8.5, x: 0.1, z: -1.5, yaw: Math.PI, ease: 'linear' }], { build: 'f' });
add(4, [{ t: 0, x: 0.35, z: 6.6, yaw: Math.PI }, { t: 8.5, x: 0.4, z: -0.9, yaw: Math.PI, ease: 'linear' }], { child: true });
add(5, [{ t: 0, x: 1.6, z: -9.0, yaw: -Math.PI / 2 + 0.3 }], { elder: true, build: 'm' }).act([{ t: 0, pose: 'stand' }]);
add(6, [{ t: 0, x: -1.4, z: -7.2, yaw: Math.PI / 2 - 0.2 }], { build: 'f', hairStyle: 'wrap' }).act([{ t: 0, pose: 'holdFront', p: { h: 1.0 } }]);
add(7, [{ t: 0, x: 2.2, z: 4.0, yaw: -Math.PI / 2 }, { t: 8.5, x: 2.1, z: 4.0, yaw: -Math.PI / 2 }], { build: 'm' });
const trolley = new THREE.Group(); trolley.add(K.at(K.box(0.32, 0.45, 0.25, K.mat('#2f4a8a', { roughness: 0.7 }), { r: 0.04 }), 0, 0.42, 0)); trolley.add(K.at(K.rot(K.cyl(0.08, 0.08, 0.04, K.MAT.rubber(), 14), 0, 0, Math.PI / 2), 0, 0.08, -0.05)); trolley.add(K.at(K.cyl(0.01, 0.01, 0.9, K.MAT.darkMetal(), 6), 0, 0.6, -0.12)); S.add(trolley);
app.after(t => { const p = crowd[0].arms.R.grip.getWorldPosition(V()); trolley.position.set(p.x, 0, p.z - 0.25); });
crowd[0].hand('R', [{ t: 0, at: () => crowd[0].root.localToWorld(V(0.15, 0.95, -0.2)), pole: [0.7, -0.6, 0.2] }]);

// cast: the vendor behind his stall, the cook (from the community kitchen) in front of it
const lines = await K.dialogue('s07');
const vendor = puppet('VENDOR'); vendor.place(-3.75, -2.25, Math.PI / 2); app.cast(vendor); vendor.speak(lines);
const cook = puppet('COOK'); app.cast(cook); cook.speak(lines);
cook.walk([{ t: 0, x: -0.6, z: 0.8, yaw: Math.PI }, { t: 1.9, x: -1.55, z: -1.8, yaw: -Math.PI / 2 - 0.25 }, { t: 2.3, x: -1.6, z: -1.95, yaw: -Math.PI / 2 },
  { t: 4.35, x: -1.6, z: -1.95, yaw: -Math.PI / 2 }, { t: 4.95, x: -2.32, z: -2.02, yaw: -Math.PI / 2 }]);   // she steps up to the counter
// a crate of imperfect tomatoes waits at the front of the counter (the display crates fill the middle of it); the vendor
// gestures to it, the cook steps up and lifts it by its handles. The crate leads and the hands follow it.
const heroCrate = P.crate({ fill: 'tomatoUgly', color: '#7a5a3a', w: 0.5, d: 0.32, h: 0.2, layers: 2, level: 0.7 }); S.add(heroCrate);
const CW = 0.5, CD = 0.32, CH = 0.2, TOP = 0.84;   // crate size, counter height
const C1 = V(-2.72, TOP, -2.02), carryAt = () => cook.root.localToWorld(V(0, 0.95, 0.37));
const crateYaw0 = Math.PI / 2;   // long sides face the vendor and the cook, the handled ends their left and right
const lift = (t) => K.smooth(K.clamp((t - 5.55) / 0.75));
app.on(t => { const u = lift(t);
  if (u <= 0) heroCrate.position.copy(C1);
  else { const up = C1.clone().lerp(carryAt(), u); up.y += 0.06 * Math.sin(Math.PI * u); heroCrate.position.copy(up); }   // (up off the counter first, then in)
  let to = cook.root.rotation.y; to += Math.round((crateYaw0 - to) / Math.PI) * Math.PI; heroCrate.rotation.y = K.lerp(crateYaw0, to, u); heroCrate.updateMatrixWorld(true); });   // ends to her sides
const cq = () => heroCrate.getWorldQuaternion(new THREE.Quaternion()), cw = (x, y, z) => heroCrate.localToWorld(V(x, y, z)), cd = (x, y, z) => V(x, y, z).normalize().applyQuaternion(cq());
// which handled end (crate +x or -x) is on a given side of a person, once, with the crate at rest
heroCrate.position.copy(C1); heroCrate.rotation.y = crateYaw0; heroCrate.updateMatrixWorld(true);
const endFor = (p, s) => { p.root.updateMatrixWorld(true); const side = p.root.localToWorld(V(s === 'L' ? -1 : 1, 1, 0)), a = cw(1, 0, 0), b = cw(-1, 0, 0); return side.distanceTo(a) < side.distanceTo(b) ? 1 : -1; };
// vendor: hands resting on his side of the counter; on his line he opens a hand towards the crate, palm up
const vw = (x, y, z) => vendor.root.localToWorld(V(x, y, z)), vd = (x, y, z) => V(x, y, z).normalize().applyQuaternion(vendor.root.getWorldQuaternion(new THREE.Quaternion()));
// (a hand target is the palm centre, which sits 1.8 cm off the palm along its normal)
const onCounter = (s) => ({ at: () => vw(s === 'L' ? -0.2 : 0.2, TOP - 0.012, 0.15), aim: () => ({ fingers: vd(s === 'L' ? 0.15 : -0.15, -0.12, 1), palm: vd(0, -1, 0) }), shape: 'relaxed' });
const offer = { at: () => vw(-0.12, 1.1, 0.36), aim: () => { const d = heroCrate.getWorldPosition(V()).add(V(0, 0.1, 0)).sub(vw(-0.12, 1.1, 0.36)).normalize(); return { fingers: d, palm: V(0, 1, 0) }; }, shape: 'spread' };
vendor.act([{ t: 0, pose: 'stand' }]);
vendor.hand('L', [{ t: 0, ...onCounter('L'), pole: [-0.6, -0.7, -0.2] }, { t: 2.15, ...offer, blend: 0.5, pole: [-0.7, -0.6, -0.1] }, { t: 3.75, ...onCounter('L'), blend: 0.65 }]);
vendor.hand('R', [{ t: 0, ...onCounter('R'), pole: [0.6, -0.7, -0.2] }]);
vendor.look([{ t: 0, at: () => heroCrate.getWorldPosition(V()) }, { t: 1.8, at: () => cook.head.getWorldPosition(V()), blend: 0.4 }]);
vendor.face([{ t: 0, smile: 0.2, brow: 0.1 }, { t: 2.2, smile: 0.1, brow: 0.4, tilt: 0.4 }, { t: 5.2, smile: 0.6, brow: 0.3, tilt: 0 }]);
// cook: reaches for the handles, fingers hooked under the handle bars from outside (palms up), lifts and draws it in
const handle = (sx) => ({ at: () => cw(sx * (CW / 2 + 0.045), CH - 0.07, 0), aim: () => ({ fingers: cd(-sx, 0.3, 0), palm: cd(-sx * 0.3, 1, 0) }), shape: 'hold' });
cook.act([{ t: 0, pose: 'stand' }, { t: 4.9, pose: 'bend', p: { amount: 0.32 }, blend: 0.5 }, { t: 5.75, pose: 'stand', blend: 0.6 }]);
cook.root.position.set(-2.32, 0, -2.02); cook.root.rotation.y = -Math.PI / 2;   // (where she takes it; the walk keys move her from frame one)
for (const s of ['L', 'R']) { const sx = endFor(cook, s);
  cook.hand(s, [{ t: 0, at: null }, { t: 4.95, ...handle(sx), blend: 0.55, pole: [s === 'L' ? -0.7 : 0.7, -0.6, -0.3] }]); }
cook.look([{ t: 0, at: () => veg.localToWorld(V(0, 1.0, 0.2)) }, { t: 2.0, at: () => heroCrate.getWorldPosition(V()), blend: 0.4 }, { t: 3.9, at: () => vendor.head.getWorldPosition(V()), blend: 0.4 }, { t: 5.0, at: () => heroCrate.getWorldPosition(V()), blend: 0.4 }, { t: 6.4, at: () => vendor.head.getWorldPosition(V()), blend: 0.6 }]);
cook.face([{ t: 0, smile: 0.35, brow: 0.2 }, { t: 3.7, smile: 0.6, brow: 0.35 }, { t: 6.3, smile: 0.7, brow: 0.2 }]);

// camera
const vF = () => vendor.head.getWorldPosition(V()).add(V(0, 0.09, 0)), cF = () => cook.head.getWorldPosition(V()).add(V(0, 0.09, 0));
app.rig = new K.Rig([
  { t: 0.0, pos: [1.6, 2.6, 7.5], look: [-0.8, 1.4, -4.0], fov: 40, focus: 8, aperture: 0.0015 },
  { t: 2.0, pos: [1.2, 2.2, 5.6], look: [-1.4, 1.35, -2.6], fov: 37, focus: cF, aperture: 0.002 },
  { t: 2.0001, cut: true, pos: () => vF().add(V(1.6, -0.15, 0.85)), look: () => vF().add(V(0.15, -0.3, 0)), fov: 30, focus: vF, aperture: 0.005 },
  { t: 4.3, pos: () => vF().add(V(1.55, -0.15, 0.78)), look: () => vF().add(V(0.15, -0.3, 0)), fov: 29, focus: vF, aperture: 0.005 },
  { t: 4.3001, cut: true, pos: [-3.3, 1.42, -2.95], look: () => cF().add(V(-0.12, -0.28, 0)), fov: 32, focus: cF, aperture: 0.005 },
  { t: 6.5, pos: [-3.28, 1.4, -2.9], look: () => cF().add(V(-0.12, -0.3, 0)), fov: 31, focus: cF, aperture: 0.005 },
  { t: 6.5001, cut: true, pos: () => cF().lerp(vF(), 0.5).add(V(0.4, -0.2, 2.6)), look: () => cF().lerp(vF(), 0.5).add(V(0, -0.4, 0)), fov: 36, focus: cF, aperture: 0.003 },
  { t: 8.5, pos: () => cF().lerp(vF(), 0.5).add(V(0.5, -0.1, 3.0)), look: () => cF().lerp(vF(), 0.5).add(V(0, -0.35, 0)), fov: 37, focus: cF, aperture: 0.003 },
], { handheld: 0.6 });
app.ready();
