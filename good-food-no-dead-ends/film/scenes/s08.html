<!doctype html><html><head><meta charset="utf-8"><title>s08 shared meal</title>
<script type="importmap">{"imports":{"three":"../lib/three.module.js","three/addons/":"../lib/jsm/"}}</script></head>
<body><script type="module">
// 08 | 55.5–65.5 s | SHARED MEAL — evening in the community kitchen. The tomato becomes dinner; the people behind the system.
// NOOR: "So this came from the farm?"  ASHA: "That, the greenhouse, and about six people you didn't see."
import * as K from '../lib/core.js';
import * as P from '../lib/props.js';
import * as F from '../lib/foliage.js';
import { kitchen } from '../lib/sets.js';
import { SEATS, setTable, seatCast, eating, chatter, plateOf } from '../lib/table.js';
import { puppet, frameQ } from '../lib/people.js';
import { heroTomato, heroHalves, heroPoint } from '../lib/hero.js';
import { chefKnife, knifeGrip } from '../lib/cutlery.js';
const { THREE, V } = K;
await K.loadNormals(['clay', 'skin', 'cloth', 'knit', 'rock', 'plaster', 'woodgrain', 'planks', 'tiles', 'soil']);
const app = new K.App({ duration: 10.0, fov: 30, exposure: 1.05, dof: { aperture: 0.005, maxblur: 0.012 }, bloomStrength: 0.3, bloomThreshold: 0.78, warmth: 1.06, sat: 1.04, vignette: 0.36 });
await app.hdri('apartment', { intensity: 0.35, rotation: 1.2 });
const K1 = await kitchen(app, { time: 'evening' });
const T = setTable(app, K1); const top = T.top;
const lines = await K.dialogue('s08');
const cast = seatCast(app, lines, ['MAYA', 'NOOR', 'ASHA', 'LUIS', 'VENDOR', 'WORKER', 'COLLEAGUE']);
const { NOOR: noor, ASHA: asha } = cast;

// the cook at the counter: slices the ugly tomato (same hero as the opening), slides it into the pot
const ctr = K1.counter;
const boardW = ctr.localToWorld(V(-0.3, 0.93, 0.08));
const board = P.ware.board(0.44, 0.3); board.position.copy(boardW); board.rotation.y = Math.PI / 2; app.add(board);
// the knife in her right fist (driver 'L'), her left hand a claw on the fruit; the blade goes down through the stem
// line with a slicing stroke, the halves fall open on the board, cut faces up
const cook = puppet('COOK'); cook.place(3.56, -0.75, Math.PI / 2); app.cast(cook); cook.speak(lines);
const boardTop = boardW.y + 0.011, heroBottom = heroPoint(Math.PI, 0).y, heroTop = heroPoint(0.32, 0).y;
const tomatoC = boardW.clone().add(V(0.0, 0.011 - heroBottom, 0.0));
const whole = heroTomato(); whole.position.copy(tomatoC); app.add(whole);
const [hA, hB] = heroHalves({ ph: 0 }); app.add(hA, hB);   // cut plane = the cook's forward (x) and up; A on +z, B on -z
const knife = chefKnife(); app.add(knife); const KG = knifeGrip('L'); cook.attach('L', knife, { pos: KG.pos, q: KG.q });
const qKnife = new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().makeBasis(V(0, 0, 1).cross(V(1, -0.02, 0).normalize()), V(0, 0, 1), V(1, -0.02, 0).normalize()));   // blade level: the edge meets the board
const qHandK = qKnife.clone().multiply(KG.q.clone().invert()), edgeMid = V(-0.044, 0, 0.1);
const cutDepth = (t) => 1 - K.smooth((t - 0.22) / 0.66);                       // 1 = above the fruit, 0 = blade on the board
const knifePalm = (t) => { const e = tomatoC.clone().add(V(0.012 * Math.sin(t * 13) * (t > 0.2 && t < 0.9 ? 1 : 0), heroTop + 0.03 - tomatoC.y + boardTop - boardTop, 0)); e.y = K.lerp(boardTop + 0.001, tomatoC.y + heroTop + 0.03, cutDepth(t));
  const origin = e.sub(edgeMid.clone().applyQuaternion(qKnife)); return origin.sub(V(...KG.pos).applyQuaternion(qHandK)); };
cook.act([{ t: 0, pose: 'stand', talk: 0, mod: { spX: 0.22 } }, { t: 2.2, pose: 'stand', blend: 0.4 }]);
cook.hand('L', [{ t: 0, at: knifePalm, aim: () => qHandK, shape: 'knife', pole: [0.7, -0.6, -0.4] },
  { t: 1.05, at: () => knifePalm(1.0).add(V(-0.06, 0.12, 0.05)), aim: () => qHandK, shape: 'knife', blend: 0.5, pole: [0.7, -0.6, -0.4] }]);
const clawAt = () => tomatoC.clone().add(V(0.005, heroTop + 0.042, -0.03));
cook.hand('R', [{ t: 0, at: clawAt, aim: () => frameQ(V(0.75, -0.55, 0.15), V(0.05, -1, 0.1)), shape: 'claw', pole: [-0.7, -0.6, -0.4] },
  { t: 0.86, at: () => boardW.clone().add(V(-0.06, 0.13, -0.16)), aim: () => frameQ(V(0.8, -0.3, 0.2), V(0, -1, 0)), shape: 'relaxed', blend: 0.4, pole: [-0.7, -0.6, -0.4] }]);
cook.look([{ t: 0, at: () => tomatoC.clone() }]);
cook.face([{ t: 0, smile: 0.45, brow: 0.1 }]);
// halves: from the cut they part and roll back onto their skins, faces up (rest on the board's surface)
const bbox = new THREE.Box3();
app.after(t => { const cut = t > 0.88; whole.visible = !cut; hA.visible = hB.visible = cut;
  const k = K.smooth((t - 0.88) / 0.45);
  for (const [h, sg] of [[hA, 1], [hB, -1]]) { h.position.copy(tomatoC).add(V(0, 0, sg * (0.002 + 0.03 * k))); h.rotation.set(sg * k * 1.25, 0, 0); h.updateMatrixWorld(true);
    bbox.setFromObject(h.children[0]); h.position.y += boardTop - bbox.min.y; h.updateMatrixWorld(true); } });
K.steam(app, { at: boardW.clone().add(V(0.12, 0.35, -0.5)), count: 10, height: 0.6, size: 0.18, opacity: 0.16 });

// at the table: everyone eating and talking; Noor's question; Asha's answer (with a count on her fingers)
for (const [n, ph, rate] of [['MAYA', 0.3, 0.8], ['LUIS', 1.7, 0.7], ['VENDOR', 2.6, 0.85], ['WORKER', 0.9, 0.75], ['COLLEAGUE', 2.1, 0.9]]) { eating(app, cast[n], top, { phase: ph, rate }); chatter(cast[n], { phase: ph, smile: 0.45, laugh: n === 'WORKER' || n === 'MAYA' ? 1 : 0, from: 7.9, until: 9.6 }); }
const bread = new THREE.Group(); app.add(bread);
eating(app, noor, top, { phase: 0.0, rate: 0.6, until: 1.6, chew: false });
noor.look([{ t: 0, at: () => plateOf('NOOR', top) }, { t: 2.4, at: () => asha.head.getWorldPosition(V()), blend: 0.4 }, { t: 7.1, at: () => cast.LUIS.head.getWorldPosition(V()), blend: 0.45 }, { t: 7.9, at: () => cast.MAYA.head.getWorldPosition(V()), blend: 0.4 }, { t: 8.7, at: () => asha.head.getWorldPosition(V()), blend: 0.4 }]);
noor.face([{ t: 0, smile: 0.3, brow: 0.2 }, { t: 2.0, smile: 0.2, brow: 0.55 }, { t: 5.2, smile: 0.1, brow: 0.6, tilt: 0.4 }, { t: 7.4, smile: 0.5, brow: 0.5, tilt: 0 }]);
asha.act([{ t: 0, pose: 'sit', p: { seat: 0.46, lean: 0.14 }, talk: 0.3 }]);
asha.hand('L', [{ t: 0, at: () => plateOf('ASHA', top).add(V(-0.15, 0.02, 0)), pole: [-0.8, -0.6, -0.3] }]);
asha.hand('R', [{ t: 0, at: () => plateOf('ASHA', top).add(V(0.12, 0.03, 0)), pole: [0.8, -0.6, -0.3] }, { t: 5.6, at: () => asha.root.localToWorld(V(0.16, 1.02, 0.34)), blend: 0.5, pole: [0.8, -0.7, -0.2] }, { t: 7.6, at: () => plateOf('ASHA', top).add(V(0.12, 0.03, 0)), blend: 0.6 }]);
asha.look([{ t: 0, at: () => noor.head.getWorldPosition(V()) }, { t: 5.4, at: V(-1.0, 1.4, 1.8), blend: 0.5, w: 0.7 }, { t: 6.6, at: () => noor.head.getWorldPosition(V()), blend: 0.4 }]);
asha.face([{ t: 0, smile: 0.35, brow: 0.1 }, { t: 4.4, smile: 0.5, brow: 0.35, tilt: 0.3 }, { t: 7.5, smile: 0.6, brow: 0.2, tilt: 0 }]);

// camera: A macro tomato cut at the counter → B two-shot across the table → C Asha → D dolly along the table: the people
const nF = () => noor.head.getWorldPosition(V()).add(V(0, 0.09, 0)), aF = () => asha.head.getWorldPosition(V()).add(V(0, 0.09, 0));
app.rig = new K.Rig([
  { t: 0.0, pos: () => boardW.clone().add(V(0.4, 0.25, 0.14)), look: () => boardW.clone().add(V(0, 0.045, 0)), fov: 24, focus: () => boardW.clone().add(V(0, 0.045, 0)), aperture: 0.02 },
  { t: 2.0, pos: () => boardW.clone().add(V(0.33, 0.22, 0.11)), look: () => boardW.clone().add(V(0, 0.035, 0)), fov: 22, focus: () => boardW.clone().add(V(0, 0.035, 0)), aperture: 0.02 },
  { t: 2.0001, cut: true, pos: [0.0, 1.12, 1.25], look: [0.0, 1.02, -0.6], fov: 31, focus: nF, aperture: 0.005 },
  { t: 4.4, pos: [0.0, 1.12, 1.1], look: [0.0, 1.03, -0.6], fov: 30, focus: nF, aperture: 0.005 },
  { t: 4.4001, cut: true, pos: () => aF().add(V(-0.4, -0.1, 1.0)), look: () => aF().add(V(-0.02, -0.08, 0)), fov: 27, focus: aF, aperture: 0.007 },
  { t: 7.6, pos: () => aF().add(V(-0.37, -0.1, 0.92)), look: () => aF().add(V(-0.02, -0.08, 0)), fov: 26, focus: aF, aperture: 0.007 },
  { t: 7.6001, cut: true, pos: [-3.0, 1.32, 1.7], look: [-1.2, 1.0, -0.2], fov: 32, focus: () => cast.MAYA.head.getWorldPosition(V()), aperture: 0.004 },
  { t: 10.0, pos: [-2.3, 1.3, 1.9], look: [-0.3, 1.0, -0.3], fov: 32, focus: () => cast.VENDOR.head.getWorldPosition(V()), aperture: 0.004 },
], { handheld: 0.5 });
app.ready();
</script></body></html>
