<!doctype html><html><head><meta charset="utf-8"><title>s10 return to table</title>
<script type="importmap">{"imports":{"three":"../lib/three.module.js","three/addons/":"../lib/jsm/"}}</script></head>
<body><script type="module">
// 10 | 73.5–80 s | RETURN TO THE TABLE — the same table, the tomato-red motif. Noor tastes; the whole table keeps talking and laughing.
// NOOR (mouth full): "Okay. Not ugly."  ASHA: "High praise."
import * as K from '../lib/core.js';
import * as P from '../lib/props.js';
import { kitchen } from '../lib/sets.js';
import { SEATS, setTable, seatCast, eating, chatter, plateOf } from '../lib/table.js';
const { THREE, V } = K;
await K.loadNormals(['clay', 'skin', 'cloth', 'knit', 'rock', 'plaster', 'woodgrain', 'planks', 'tiles', 'soil']);
const app = new K.App({ duration: 6.5, fov: 30, exposure: 1.05, dof: { aperture: 0.005, maxblur: 0.012 }, bloomStrength: 0.3, bloomThreshold: 0.78, warmth: 1.06, sat: 1.04, vignette: 0.36 });
await app.hdri('apartment', { intensity: 0.35, rotation: 1.2 });
const K1 = await kitchen(app, { time: 'evening' });
const T = setTable(app, K1); const top = T.top;
const lines = await K.dialogue('s10');
const cast = seatCast(app, lines);   // everyone, including the cook at the end of the table
const { NOOR: noor, ASHA: asha } = cast;
// a slice of the ugly tomato on Noor's fork — the motif returns
const slice = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.012, 24), new THREE.MeshPhysicalMaterial({ color: '#d8401f', roughness: 0.25, clearcoat: 0.9 })); slice.castShadow = true; app.add(slice);
const fork = P.ware.fork(); fork.scale.setScalar(1.15); app.add(fork);
const plate = plateOf('NOOR', top);
const mouthN = () => noor.head.getWorldPosition(V()).add(noor.offsetToWorld([0, -0.02, 0.14])).add(V(0, 0.05, 0));
noor.act([{ t: 0, pose: 'sit', p: { seat: 0.46, lean: 0.16 }, talk: 0.3 }]);
noor.hand('R', [{ t: 0, at: () => plate.clone().add(V(0.05, 0.03, 0)), pole: [0.8, -0.6, -0.3] }, { t: 0.25, at: mouthN, blend: 0.55 }, { t: 1.05, at: () => noor.root.localToWorld(V(0.12, 0.86, 0.32)), blend: 0.45 }]);
noor.hand('L', [{ t: 0, at: () => plate.clone().add(V(-0.17, 0.02, -0.03)), pole: [-0.8, -0.6, -0.3] }]);
noor.look([{ t: 0, at: () => slice.getWorldPosition(V()) }, { t: 1.0, at: () => asha.head.getWorldPosition(V()), blend: 0.45 }, { t: 4.4, at: () => cast.LUIS.head.getWorldPosition(V()), blend: 0.5 }]);
noor.face([{ t: 0, smile: 0.2, brow: 0.3 }, { t: 0.8, chew: 1, smile: 0.1, brow: -0.1, squint: 0.3 }, { t: 1.6, chew: 0.7, smile: 0.35, brow: 0.45, tilt: 0.4, squint: 0 }, { t: 3.5, chew: 0.3, smile: 0.75, brow: 0.3, tilt: 0 }, { t: 4.5, chew: 0, smile: 0.9, jaw: 0.25, squint: 0.4 }]);
app.after(t => { const g = noor.arms.R.grip.getWorldPosition(V()); fork.position.copy(g); fork.lookAt(t < 0.9 ? mouthN() : plate); slice.position.copy(g).add(noor.offsetToWorld([0, 0.012, 0.09])); slice.visible = t < 0.95; });
asha.act([{ t: 0, pose: 'sit', p: { seat: 0.46, lean: 0.14 }, talk: 0.4 }]);
asha.hand('L', [{ t: 0, at: () => plateOf('ASHA', top).add(V(-0.15, 0.02, 0)), pole: [-0.8, -0.6, -0.3] }]);
asha.hand('R', [{ t: 0, at: () => plateOf('ASHA', top).add(V(0.12, 0.03, 0)), pole: [0.8, -0.6, -0.3] }]);
asha.look([{ t: 0, at: () => noor.head.getWorldPosition(V()) }, { t: 5.0, at: () => cast.COOK.head.getWorldPosition(V()), blend: 0.5 }]);
asha.face([{ t: 0, smile: 0.35, brow: 0.2 }, { t: 3.7, smile: 0.25, brow: 0.6, tilt: 0.5 }, { t: 4.9, smile: 0.85, brow: 0.3, tilt: 0, jaw: 0.2, squint: 0.4 }]);
for (const [n, ph, rate, laugh] of [['MAYA', 0.3, 0.8, 1], ['LUIS', 1.7, 0.7, 1], ['VENDOR', 2.6, 0.85, 1], ['WORKER', 0.9, 0.75, 1], ['COLLEAGUE', 2.1, 0.9, 0], ['COOK', 1.2, 0.8, 1]]) { eating(app, cast[n], top, { phase: ph, rate, until: 4.6 }); chatter(cast[n], { phase: ph, smile: 0.5, laugh, from: 4.95, until: 6.5 }); }
cast.LUIS.look([{ t: 0, at: () => noor.head.getWorldPosition(V()) }]); cast.MAYA.look([{ t: 0, at: () => noor.head.getWorldPosition(V()) }]); cast.COOK.look([{ t: 0, at: () => noor.head.getWorldPosition(V()) }]);
cast.WORKER.look([{ t: 0, at: () => cast.VENDOR.head.getWorldPosition(V()) }, { t: 4.9, at: () => noor.head.getWorldPosition(V()), blend: 0.4 }]); cast.VENDOR.look([{ t: 0, at: () => cast.WORKER.head.getWorldPosition(V()) }, { t: 4.9, at: () => asha.head.getWorldPosition(V()), blend: 0.4 }]); cast.COLLEAGUE.look([{ t: 0, at: () => cast.MAYA.head.getWorldPosition(V()) }]);
// camera: A Noor tastes ("Okay. Not ugly.") → B Asha ("High praise.") → C crane back: everyone at one table, laughing
const nF = () => noor.head.getWorldPosition(V()).add(V(0, 0.09, 0)), aF = () => asha.head.getWorldPosition(V()).add(V(0, 0.09, 0));
app.rig = new K.Rig([
  { t: 0.0, pos: () => nF().add(V(0.34, -0.02, 1.1)), look: () => nF().add(V(0.0, -0.08, 0)), fov: 29, focus: nF, aperture: 0.007 },
  { t: 3.6, pos: () => nF().add(V(0.3, -0.02, 1.0)), look: () => nF().add(V(0.0, -0.08, 0)), fov: 28, focus: nF, aperture: 0.007 },
  { t: 3.6001, cut: true, pos: () => aF().add(V(-0.38, -0.08, 0.95)), look: () => aF().add(V(-0.02, -0.08, 0)), fov: 27, focus: aF, aperture: 0.007 },
  { t: 4.95, pos: () => aF().add(V(-0.35, -0.08, 0.88)), look: () => aF().add(V(-0.02, -0.08, 0)), fov: 26, focus: aF, aperture: 0.007 },
  { t: 4.9501, cut: true, pos: [3.1, 1.55, 1.9], look: [0.0, 0.95, -0.1], fov: 34, focus: () => asha.head.getWorldPosition(V()), aperture: 0.003 },
  { t: 6.5, pos: [3.6, 2.15, 2.6], look: [-0.1, 0.9, -0.15], fov: 36, focus: () => asha.head.getWorldPosition(V()), aperture: 0.0025, ease: K.easeOut },
], { handheld: 0.5 });
app.ready();
</script></body></html>
