const app = new K.App({ duration: 9.0, fov: 32, exposure: 1.0, dof: { aperture: 0.004, maxblur: 0.012 }, bloomStrength: 0.25, bloomThreshold: 0.82, warmth: 1.0, sat: 1.02, vignette: 0.33 });

const corr = K.canvasTex(256, 64, (g, w, h) => { const img = g.createImageData(w, h); for (let x = 0; x < w; x++) { const nx = Math.cos(x / w * Math.PI * 16) * 0.6; for (let y = 0; y < h; y++) { const i = (y * w + x) * 4; img.data[i] = (nx * 0.5 + 0.5) * 255; img.data[i + 1] = 128; img.data[i + 2] = 230; img.data[i + 3] = 255; } } g.putImageData(img, 0, 0); }, { linear: true, repeat: [6, 1] });

for (let k = 0; k < 3; k++) { const c = P.crate({ fill: K.pick(['tomato', 'greens']), color: '#2f8a57', layers: 1 }); c.position.set(-2.2 + k * 0.62, 0.9, -0.5); S.add(c); }
const bg1 = puppet('H1', extraSpec(61, { outer: 'hivis', outerColor: '#d2ea3c', hairStyle: 'wrap' })); bg1.place(-1.7, -1.1, 0); app.cast(bg1); bg1.act([{ t: 0, pose: 'pick', mod: { spX: 0.25, drop: -0.25 } }]); bg1.look([{ t: 0, at: V(-1.7, 0.9, -0.5) }]);

const bg2c = P.crate({ fill: 'greens', color: '#2f6aa0' }); S.add(bg2c); app.after(t => { const a = bg2.arms.L.grip.getWorldPosition(V()), b = bg2.arms.R.grip.getWorldPosition(V()); bg2c.position.copy(a).lerp(b, 0.5).add(V(0, -0.18, 0)); bg2c.rotation.y = bg2.root.rotation.y + Math.PI / 2; });

// cast: Luis coordinating; the hub worker with a hand truck of two crates tagged surplus (yellow tags)

const luis = puppet('LUIS'); app.cast(luis); luis.speak(lines);
const wkr = puppet('WORKER'); app.cast(wkr); wkr.speak(lines);
luis.walk([{ t: 0, x: -1.9, z: 0.9, yaw: 0.9 }, { t: 2.1, x: 0.6, z: -1.15, yaw: 1.0, ease: 'linear' }, { t: 2.6, x: 0.68, z: -1.2, yaw: 1.05 }]);
wkr.walk([{ t: 0, x: 6.1, z: -2.6, yaw: -Math.PI / 2 }, { t: 2.4, x: 6.1, z: -2.6, yaw: -Math.PI / 2 }, { t: 4.2, x: 2.75, z: -1.75, yaw: -Math.PI / 2 + 0.45 }, { t: 7.4, x: 2.75, z: -1.75, yaw: -Math.PI / 2 + 0.45 }, { t: 9.0, x: 1.9, z: -4.6, yaw: Math.PI + 0.25, turnFast: true }]);
const truck = P.handTruck(); S.add(truck);
const tagM = K.mat('#f2c230', { roughness: 0.5 });
const tc = [P.crate({ fill: 'tomatoUgly', color: '#2f8a57' }), P.crate({ fill: 'greens', color: '#2f8a57' })]; tc.forEach((c, i) => { const tag = K.box(0.08, 0.1, 0.004, tagM); tag.position.set(0.15, 0.2, 0.205); c.add(tag); S.add(c); });
wkr.act([{ t: 0, pose: 'stand', talk: 0.6 }]);

wkr.hand('R', [{ t: 0, at: () => truck.localToWorld(V(0.18, 1.2, -0.16)), pole: [0.7, -0.6, -0.2] }, { t: 4.9, at: null, blend: 0.35 }, { t: 6.0, at: () => truck.localToWorld(V(0.18, 1.2, -0.16)), blend: 0.4 }]);
app.on(t => { const r = wkr.rootAt(t); const yaw = r.yaw; truck.position.set(r.x + Math.sin(yaw) * 0.55, 0, r.z + Math.cos(yaw) * 0.55); truck.rotation.set(-0.25, yaw + Math.PI, 0); tc.forEach((c, i) => { c.position.copy(truck.localToWorld(V(0, 0.07 + i * 0.305, 0.12))); c.quaternion.copy(truck.quaternion); }); });
wkr.look([{ t: 0, at: V(3, 1.2, -1) }, { t: 4.2, at: () => luis.head.getWorldPosition(V()), blend: 0.35 }, { t: 7.5, at: V(1.2, 1.2, -8.5), blend: 0.5 }]);
wkr.face([{ t: 0, smile: 0.2 }, { t: 4.3, smile: 0.05, brow: 0.35, tilt: 0.4 }, { t: 6.8, smile: 0.45, brow: 0.2, tilt: 0 }]);

luis.face([{ t: 0, smile: 0.2, brow: 0.1 }, { t: 6.5, smile: 0.5, brow: 0.3 }]);
// route-map tablet (wordless): hub → school kitchen; the route lights up on "Then route them to dinner."
const scr = document.createElement('canvas'); scr.width = 320; scr.height = 220; const sg = scr.getContext('2d'); const scrTex = new THREE.CanvasTexture(scr); scrTex.colorSpace = THREE.SRGBColorSpace;
function drawMap(t) { const g = sg; g.fillStyle = '#eef1ec'; g.fillRect(0, 0, 320, 220); g.strokeStyle = '#cdd3cc'; g.lineWidth = 10; for (const [a, b, c, d] of [[0, 60, 320, 80], [0, 160, 320, 140], [90, 0, 110, 220], [230, 0, 210, 220]]) { g.beginPath(); g.moveTo(a, b); g.lineTo(c, d); g.stroke(); } g.fillStyle = '#b9d8b0'; g.fillRect(130, 95, 60, 35);
  const u = K.smoother((t - 6.7) / 1.2); g.strokeStyle = '#2f8a57'; g.lineWidth = 6; g.setLineDash([]); g.beginPath(); g.moveTo(60, 150); g.lineTo(60 + 40 * Math.min(1, u * 3), 150 - 6 * Math.min(1, u * 3)); if (u > 0.33) g.lineTo(100 + 0 * u, 145 - 85 * Math.min(1, (u - 0.33) * 3)); if (u > 0.66) g.lineTo(100 + 120 * Math.min(1, (u - 0.66) * 3), 60 + 10 * Math.min(1, (u - 0.66) * 3)); g.stroke();
  g.fillStyle = '#26364f'; g.beginPath(); g.arc(60, 150, 9, 0, 6.3); g.fill(); g.fillStyle = '#cf5f2a'; g.beginPath(); g.arc(225, 68, 10 + 3 * u, 0, 6.3); g.fill(); g.strokeStyle = '#fff'; g.lineWidth = 2; g.beginPath(); g.moveTo(221, 62); g.lineTo(221, 74); g.moveTo(229, 62); g.lineTo(229, 74); g.stroke(); scrTex.needsUpdate = true; }
