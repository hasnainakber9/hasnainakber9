<!doctype html><html><head><meta charset="utf-8"><title>meme: the turtle test, 2050</title>
<script type="importmap">{"imports":{"three":"../../film/lib/three.module.js","three/addons/":"../../film/lib/jsm/"}}</script></head>
<body><script type="module">
// THE TURTLE TEST, 2050: a wildlife overpass, a planted land bridge over the highway, and the tortoise crossing on top
// while the traffic goes underneath. Layers: bg (the overpass, road, woods), fg:turtle (the tortoise, lit by its own
// light from the left; the plate's sun is high on the right)
import { K, THREE, V, subject, lightFor, applyLayer } from '../lib/meme.js';
import * as F from '../../film/lib/foliage.js';
import * as P from '../../film/lib/props.js';
import { tortoise } from '../lib/tortoise.js';
import { car, truck } from '../lib/vehicles.js';
import * as RK from '../lib/roadkit.js';
await K.loadNormals(['clay', 'skin', 'cloth', 'rock', 'plaster']);
K.seed(50);
const app = new K.App({ duration: 4, fov: 25, exposure: 0.95, dof: { aperture: 0.0002, maxblur: 0.002 }, bloomStrength: 0.12, bloomThreshold: 0.9, warmth: 1.0, sat: 1.02, vignette: 0, grain: 0 });
const S = app.scene;
const SUN = V(0.55, 0.72, 0.42);
K.skyDome(app, { top: '#3f7fd0', mid: '#86b4e6', horizon: '#d6e4ee', sunDir: SUN, sunIntensity: 0, glow: 0.35, fogColor: '#c9d9e6', fogNear: 60, fogFar: 700, env: 0.9 });
await K.clouds(app, { count: 12, yaw: 0.1, spread: 1.0, opacity: 0.85, color: '#ffffff', minY: 35, maxY: 75, scale: 0.85 });
lightFor(K.sunLight(app, { dir: SUN, color: '#fff3df', intensity: 2.9, size: 48, target: V(0, 4, 0), softness: 3, mapSize: 4096 }), 'bg');
lightFor(K.fillLights(app, { sky: '#b9d0ec', ground: '#6f7a52', hemi: 0.6 }), 'bg');

// ------------------------------------------------------------------ the highway under it: two lanes each way, a grass median strip
const LANE = 3.5, LEN = 420, Z0 = 60;
RK.road(S, -8.4, 8.4, Z0, LEN, 5, [-5.25, -1.75, 1.75, 5.25], { wear: 0.18, oil: 0.2, patches: 4, cracks: 15, base: 182 });
for (const x of [-LANE, LANE]) for (let z = Z0 - 1; z > -LEN + 60; z -= 12) RK.stripe(S, x, z - 3, z, 0.15);
RK.stripe(S, -0.12, -LEN + 60, Z0, 0.12, '#e2b52a'); RK.stripe(S, 0.12, -LEN + 60, Z0, 0.12, '#e2b52a'); RK.stripe(S, -7.2, -LEN + 60, Z0, 0.18); RK.stripe(S, 7.2, -LEN + 60, Z0, 0.18);

// ------------------------------------------------------------------ the overpass: a board-formed concrete face with a
// segmental arch over the road, a cast arch ring and coping; the deck carries a planted earth berm
const D = 34, HT = 7.8, AW = 9.2, SPR = 3.4, CROWN = 6.1, FW = 40;   // depth along the road, top of wall, arch half-width, springing, crown, face half-width
const archR = (AW * AW + (CROWN - SPR) ** 2) / (2 * (CROWN - SPR)), archCy = CROWN - archR, a0 = Math.asin(AW / archR);
const archPts = (r, n = 48) => { const pts = []; for (let i = 0; i <= n; i++) { const a = -a0 + 2 * a0 * i / n; pts.push(new THREE.Vector2(Math.sin(a) * r, archCy + Math.cos(a) * r)); } return pts; };
// concrete: 1.2 m by 0.15 m boards, tie-holes on a regular 1.2 m grid, each board its own tone; plus a macro map of the
// whole face (rain streaks down from the coping, a damp band near the ground, moss in the arch's shadow)
const board = K.canvasTex(1024, 1024, (g, w, h) => { const r = K.prng(31), bh = h / 16, bw = w / 2;   // tile: 2.4 m x 2.4 m
  for (let j = 0; j < 16; j++) for (let i = 0; i < 2; i++) { const off = (j % 2) * bw / 2, k = 0.9 + r() * 0.14; g.fillStyle = `rgb(${186 * k | 0},${182 * k | 0},${172 * k | 0})`; g.fillRect(i * bw + off - bw, j * bh, bw, bh); g.fillRect(i * bw + off, j * bh, bw, bh); g.fillRect(i * bw + off + bw, j * bh, bw, bh);
    for (let q = 0; q < 220; q++) { g.fillStyle = `rgba(${r() < 0.5 ? '255,255,250' : '70,66,60'},${0.04 + r() * 0.05})`; g.fillRect(r() * w, j * bh + r() * bh, 2 + r() * 30, 1 + r() * 2); } }
  g.fillStyle = 'rgba(80,76,68,0.45)'; for (let j = 0; j <= 16; j++) g.fillRect(0, j * bh - 1, w, 2);
  g.fillStyle = 'rgba(60,56,50,0.8)'; for (const x of [0.25, 0.75]) for (const y of [0.25, 0.75]) { g.beginPath(); g.arc(x * w, y * h, 6, 0, Math.PI * 2); g.fill(); } }, { repeat: [1, 1] });
board.wrapS = board.wrapT = THREE.RepeatWrapping; board.anisotropy = 16;
const faceMacro = K.canvasTex(1024, 256, (g, w, h) => { const r = K.prng(8); g.fillStyle = '#ffffff'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 260; i++) { const x = r() * w, L = h * (0.1 + r() * r() * 0.8), a = 0.05 + r() * 0.18; const gr = g.createLinearGradient(0, 0, 0, L); gr.addColorStop(0, `rgba(70,72,60,${a})`); gr.addColorStop(1, 'rgba(70,72,60,0)'); g.fillStyle = gr; g.fillRect(x, 0, 2 + r() * 10, L); }
  const gr = g.createLinearGradient(0, h, 0, h * 0.7); gr.addColorStop(0, 'rgba(70,74,52,0.45)'); gr.addColorStop(1, 'rgba(70,74,52,0)'); g.fillStyle = gr; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 90; i++) { g.fillStyle = `rgba(${60 + r() * 30 | 0},${80 + r() * 30 | 0},${40 + r() * 20 | 0},${0.08 + r() * 0.15})`; g.beginPath(); g.ellipse(r() * w, h * (0.75 + r() * 0.25), 6 + r() * 30, 3 + r() * 10, 0, 0, Math.PI * 2); g.fill(); } });
faceMacro.colorSpace = THREE.NoColorSpace;
const concrete = (macro) => { const m = new THREE.MeshStandardMaterial({ map: board.clone(), roughness: 0.88, normalMap: K.normalTex('plaster', 1).clone(), normalScale: new THREE.Vector2(0.35, 0.35) });
  m.map.repeat.set(1 / 2.4, 1 / 2.4); m.map.needsUpdate = true; m.normalMap.repeat.set(1 / 3, 1 / 3); m.normalMap.needsUpdate = true;
  if (macro) m.onBeforeCompile = (sh) => { sh.uniforms.macro = { value: faceMacro }; sh.uniforms.rep = { value: m.map.repeat }; sh.uniforms.box = { value: new THREE.Vector4(-FW, 0, 2 * FW, HT) };
    sh.fragmentShader = 'uniform sampler2D macro; uniform vec2 rep; uniform vec4 box;\n' + sh.fragmentShader.replace('#include <map_fragment>', '#include <map_fragment>\n vec2 wp = vMapUv / rep; diffuseColor.rgb *= texture2D(macro, vec2((wp.x - box.x) / box.z, (wp.y - box.y) / box.w)).rgb;'); };
  return m; };
// (the arch is a notch in the outline, not a hole: a hole touching the outline does not triangulate)
const face = new THREE.Shape([new THREE.Vector2(-FW, 0), new THREE.Vector2(-AW, 0), ...archPts(archR), new THREE.Vector2(AW, 0), new THREE.Vector2(FW, 0), new THREE.Vector2(FW, HT), new THREE.Vector2(-FW, HT)]);
const bridgeG = new THREE.ExtrudeGeometry(face, { depth: D, bevelEnabled: false, curveSegments: 48 }); bridgeG.translate(0, 0, -D / 2);
const bridge = new THREE.Mesh(bridgeG, [concrete(true), K.mat('#8f8c84', { roughness: 0.9, map: K.grain('plaster', { repeat: 12, scale: 3 }) })]); bridge.castShadow = bridge.receiveShadow = true; S.add(bridge);
// the arch ring, standing proud of the face by 25 cm, and a coping along the top
{ const ring = new THREE.Shape([...archPts(archR + 0.75), ...archPts(archR).reverse()]);   // one closed band: the outer arc over, the inner arc back
  const rg = new THREE.ExtrudeGeometry(ring, { depth: 0.25, bevelEnabled: true, bevelSize: 0.03, bevelThickness: 0.03, bevelSegments: 2, curveSegments: 48 }); rg.translate(0, 0, D / 2);
  const rm = concrete(false); rm.color.set('#d8d4ca'); const rmesh = new THREE.Mesh(rg, rm); rmesh.castShadow = rmesh.receiveShadow = true; S.add(rmesh);
  for (const s of [1, -1]) { const imp = K.box(0.9, 0.35, 0.32, rm); imp.position.set(s * (AW + 0.42), SPR - 0.1, D / 2 + 0.12); S.add(imp); }   // impost blocks at the springing
  const cop = K.box(2 * FW + 0.4, 0.32, 0.7, K.mat('#cfcbc0', { roughness: 0.85 })); cop.position.set(0, HT + 0.12, D / 2 - 0.15); cop.castShadow = cop.receiveShadow = true; S.add(cop);
  const cop2 = cop.clone(); cop2.position.z = -D / 2 + 0.15; S.add(cop2); }
// the planted berm on the deck: a low mound of soil and turf
{ const bg = new THREE.PlaneGeometry(2 * FW, D - 0.4, 80, 40), p = bg.attributes.position;
  for (let i = 0; i < p.count; i++) { const x = p.getX(i), y = p.getY(i), e = 1 - Math.pow(Math.abs(y) / (D / 2), 6); p.setZ(i, 0.3 + e * 0.55 + (K.fbm(x * 0.15, y * 0.15, 3) - 0.5) * 0.4 * e); }
  bg.computeVertexNormals(); const turf = K.mat('#5c8a38', { map: K.grain('leafy', { repeat: 30, scale: 6 }), roughness: 0.95 });
  const berm = new THREE.Mesh(bg, turf); berm.rotation.x = -Math.PI / 2; berm.position.set(0, HT + 0.1, 0); berm.receiveShadow = true; S.add(berm); }
// embankments: grassy slopes coming down towards the camera either side of the road, in front of the wing walls
const bank = (s) => { const g = new THREE.BufferGeometry(), x0 = s * 9.8, x1 = s * 46, zf = D / 2, zb = D / 2 + 22, pts = [];
  const N = 30, M = 20; for (let i = 0; i <= N; i++) for (let j = 0; j <= M; j++) { const u = i / N, v = j / M, x = K.lerp(x0, x1, u), z = K.lerp(zf, zb, v);
    const top = (HT + 0.6) * (1 - v * (1 - 0.35 * u)), y = top * K.smooth(Math.min(1, u * 3 + 0.35)) + (K.fbm(x * 0.2, z * 0.2, 3) - 0.5) * 0.6 * v * (1 - v) * 4; pts.push(x, Math.max(0, y), z); }
  const idx = []; for (let i = 0; i < N; i++) for (let j = 0; j < M; j++) { const a = i * (M + 1) + j, b = a + M + 1; if (s > 0) idx.push(a, b, a + 1, a + 1, b, b + 1); else idx.push(a, a + 1, b, a + 1, b + 1, b); }
  g.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3)); g.setIndex(idx); g.computeVertexNormals();
  if (g.attributes.normal.getY(Math.floor(g.attributes.normal.count / 2)) < 0) { g.setIndex(idx.map((_, i) => idx[i - (i % 3) + [0, 2, 1][i % 3]])); g.computeVertexNormals(); }   // faces up
  const col = []; for (let q = 0; q < pts.length; q += 3) { const n = K.fbm(pts[q] * 0.12, pts[q + 2] * 0.12, 4), n2 = K.noise2(pts[q] * 0.6, pts[q + 2] * 0.6); const c = new THREE.Color('#4f7a32').lerp(new THREE.Color('#8f9a50'), K.smooth((n - 0.42) / 0.3) * 0.7).multiplyScalar(0.8 + 0.35 * n2); col.push(c.r, c.g, c.b); }
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  const m = new THREE.Mesh(g, K.mat('#ffffff', { vertexColors: true, map: K.grain('leafy', { repeat: 20, scale: 6 }), roughness: 0.95 })); m.receiveShadow = true; m.castShadow = true; S.add(m); };
bank(1); bank(-1);
const bankY = (x, z) => { const u = K.clamp((Math.abs(x) - 9.8) / 36.2), v = K.clamp((z - D / 2) / 22); if (Math.abs(x) < 9.8) return 0; return (HT + 0.6) * (1 - v * (1 - 0.35 * u)) * K.smooth(Math.min(1, u * 3 + 0.35)); };
// verges along the road beyond the bridge, and the woods
const verge = K.mat('#6a9440', { map: K.grain('leafy', { repeat: 60, scale: 6 }), roughness: 0.95 });
for (const s of [1, -1]) { const v = new THREE.Mesh(new THREE.PlaneGeometry(120, LEN), verge); v.rotation.x = -Math.PI / 2; v.position.set(s * (8.4 + 60), 0.0, Z0 - LEN / 2); v.receiveShadow = true; S.add(v); }
const tl = [], r = K.prng(2050);
for (let i = 0; i < 160; i++) { const s = r() < 0.5 ? -1 : 1, x = s * (10.5 + r() * 70), z = -D / 2 - 4 - r() * 300; tl.push({ x, z, ry: r() * 6.3, s: 0.8 + r() * 0.7 }); }
for (let i = 0; i < 40; i++) { const x = (r() - 0.5) * 2 * FW * 0.95, z = -D / 2 + 3 + r() * (D - 9); if (Math.abs(x) < 4 && z > 0) continue; tl.push({ x, z, y: HT + 0.6, ry: r() * 6.3, s: 0.45 + r() * 0.4 }); }   // young trees on the bridge, kept back from the front edge
for (let i = 0; i < 24; i++) { const s = r() < 0.5 ? -1 : 1, x = s * (24 + r() * 26), z = D / 2 + 6 + r() * 14; tl.push({ x, z, y: bankY(x, z) - 0.2, ry: r() * 6.3, s: 0.7 + r() * 0.5 }); }
// three tree forms, instanced (each placement turned and scaled), so the woods do not repeat one silhouette
{ const bark = K.vmat({ roughness: 0.92 }), leaf = F.foliageMat('cluster'), forms = [3, 11, 19].map(sd2 => F.treeGeos({ height: 11, seed: sd2, cards: 220 }));
  forms.forEach((T, k) => { const L = tl.filter((_, i) => i % 3 === k); K.instanced(S, T.trunk, bark, L); K.instanced(S, T.crown, leaf, L); }); }
// shrubs, grass tufts and wildflowers along the bridge's front edge, some trailing over the coping
const grassG = P.grassGeo(), grassM = P.leafMat('blade'), flowerG = P.flowerCardsGeo(), flowerM = P.leafMat('flower');
const gl = [], fl = [];
for (let i = 0; i < 900; i++) { const x = (r() - 0.5) * 2 * FW, z = D / 2 - 0.3 - r() * r() * 6; if (Math.abs(x + 0.6) < 1.8 && z > D / 2 - 3.5) continue; gl.push({ x, y: HT + 0.35 + (z > D / 2 - 1 ? 0 : 0.2), z, ry: r() * 6.3, s: 1.4 + r() * 1.6 }); }
for (let i = 0; i < 260; i++) { const x = (r() - 0.5) * 2 * FW, z = D / 2 - 0.4 - r() * 5; fl.push({ x, y: HT + 0.45, z, ry: r() * 6.3, s: 1.6 + r() * 1.2 }); }
for (let i = 0; i < 1400; i++) { const s = r() < 0.5 ? -1 : 1, x = s * (10.5 + r() * 34), z = D / 2 + 0.5 + r() * 20; gl.push({ x, y: bankY(x, z) - 0.05, z, ry: r() * 6.3, s: 1.5 + r() * 1.5 }); if (r() < 0.25) fl.push({ x, y: bankY(x, z), z, ry: r() * 6.3, s: 1.4 + r() }); }
K.instanced(S, grassG, grassM, gl, { cast: false }); K.instanced(S, flowerG, flowerM, fl, { cast: false });
{ const sl = [[], [], []]; for (let i = 0; i < 34; i++) { const x = (r() - 0.5) * 2 * FW * 0.95; if (Math.abs(x) < 3.2) continue; sl[i % 3].push({ x, y: HT + 0.4, z: D / 2 - 1.2 - r() * 4, ry: r() * 6.3, s: 0.8 + r() * 1.0 }); }
  for (let i = 0; i < 40; i++) { const s = r() < 0.5 ? -1 : 1, x = s * (11 + r() * 30), z = D / 2 + 1 + r() * 18; sl[i % 3].push({ x, y: bankY(x, z) - 0.1, z, ry: r() * 6.3, s: 0.9 + r() * 1.3 }); }
  const sm = F.foliageMat('shrub'); sl.forEach((L, k) => K.instanced(S, F.shrubGeo({ size: 1, seed: 300 + k }), sm, L)); }
// trailing plants hanging over the coping: strands of leaf cards down the face
{ const herb = F.foliageMat('herb'); const hang = new THREE.PlaneGeometry(0.5, 1, 1, 6); hang.translate(0, -0.5, 0); hang.setAttribute('color', new THREE.Float32BufferAttribute(new Array(hang.attributes.position.count * 3).fill(1), 3));
  for (let i = 0; i < 160; i++) { const x = (r() - 0.5) * 2 * FW; if (Math.abs(x) < AW + 1.2 && r() < 0.6) continue; const L = 0.6 + r() * r() * 3.2, m = new THREE.Mesh(hang, herb); m.scale.set(0.8 + r() * 0.8, L, 1); m.position.set(x, HT + 0.3, D / 2 + 0.38); m.rotation.y = (r() - 0.5) * 0.4; m.castShadow = true; S.add(m); } }

// ------------------------------------------------------------------ traffic: under the arch and beyond, light and electric
const COLS = ['#e9e9e6', '#1a1c1f', '#a4a7ab', '#24324a', '#8c1f1a', '#d8d2c2', '#3e5a6a', '#f0f0ee'];
const pick = (a) => a[Math.floor(r() * a.length)], toward = -Math.PI / 2, away = Math.PI / 2;
RK.park(S, car({ type: 'suv', color: '#a4a7ab', lights: 0.9 }), 1.75, 4.0, toward, 4.8, 1.9);
RK.park(S, truck({ color: '#eceae4', box: '#e2e2dc', stripe: '#3b7a46', lights: 0.9 }), 5.25, -12, toward, 9, 2.4);
RK.park(S, car({ type: 'sedan', color: '#24324a', lights: 0.3, tail: 1.1 }), -1.75, -2, away, 4.7, 1.9);
RK.park(S, car({ type: 'hatch', color: '#e9e9e6', lights: 0.3, tail: 1.1 }), -5.25, -34, away, 4.1, 1.8);
for (let z = -50; z > -320; z -= 18 + r() * 30) RK.park(S, car({ type: pick(['sedan', 'hatch', 'suv']), color: pick(COLS), lights: 0.8 }), pick([1.75, 5.25]), z, toward, 4.7, 1.9);
for (let z = -60; z > -320; z -= 20 + r() * 34) RK.park(S, car({ type: pick(['sedan', 'hatch', 'suv']), color: pick(COLS), lights: 0.3, tail: 1.1 }), pick([-1.75, -5.25]), z, away, 4.7, 1.9);

// ------------------------------------------------------------------ the tortoise (fg:turtle) crossing on top, side-on, unhurried
const T = tortoise({ headYaw: -0.25, headPitch: 0.0, neck: 0.9 }); T.scale.setScalar(3.0); T.position.set(-0.6, HT + 0.5, D / 2 - 1.3); T.rotation.y = -0.12; S.add(T); subject(T, 'turtle');
const tk = lightFor(new THREE.DirectionalLight('#fff0dc', 3.1), 'fg:turtle'); tk.position.copy(T.position).add(V(-6, 6, 5)); tk.target.position.copy(T.position);   // (from the left and in front, above it) tk.castShadow = true; tk.shadow.mapSize.set(2048, 2048);
Object.assign(tk.shadow.camera, { left: -4, right: 4, top: 4, bottom: -4, near: 1, far: 30 }); tk.shadow.bias = -0.0004; S.add(tk, tk.target);
S.add(lightFor(new THREE.HemisphereLight('#bcd2ee', '#5e6a46', 0.7), 'fg:turtle'));

// ------------------------------------------------------------------ camera: on the road's shoulder, standing height, well back
const CAM = V(0.8, 2.6, D / 2 + 44), LOOK = V(0, 6.2, 0);
app.on(() => { app.camera.position.copy(CAM); app.camera.lookAt(LOOK); if (app.dof) app.dof.uniforms.focus.value = 46; });
applyLayer(app);
app.ready(); window.__ready = true;
</script></body></html>
