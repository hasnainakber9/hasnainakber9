<p class="eyebrow-d rise">The question</p>
<p class="statement rise" style="--i:1;">When almost nothing has been written about a place, does a model know less about it, and does it say so?</p>
<p class="lead-d rise" style="--i:2;">A model that is wrong but unsure does little harm. A model that is wrong inside a narrow interval hands over a number that does not exist.</p>
